<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VedaAI — Sanctuary Intelligence</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Alpine.js & Tailwind -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        earth: {
                            50: '#fffbf5',
                            100: '#f7ede0',
                            200: '#efdac2',
                            300: '#e3be97',
                            400: '#d59d68',
                            500: '#bc7b42',
                            600: '#9b5e31',
                            700: '#7e4629',
                            800: '#673926',
                            900: '#3d1e13',
                            950: '#230f0a',
                        },
                        sanctum: {
                            cream: '#fdfbf7',
                            sand: '#f5eee6',
                            gold: '#d4a359',
                            terracotta: '#c86d51',
                            dark: '#1c1614'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 163, 89, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(212, 163, 89, 0.4); }
        
        .glass-panel {
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 163, 89, 0.2);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 163, 89, 0.15);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #7e4629 0%, #d4a359 50%, #9b5e31 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-sanctum-cream font-sans text-sanctum-dark antialiased h-screen flex flex-col overflow-hidden"
      x-data="{ 
          messages: [
              { role: 'assistant', text: 'Namaste! I am VedaAI, your guide to ancient Indian wisdom, temple architecture, and Ayurvedic traditions. How may I assist your inquiry today?' }
          ],
          userInput: '',
          loading: false,
          async sendMessage() {
              if (!this.userInput.trim() || this.loading) return;
              
              const question = this.userInput;
              this.messages.push({ role: 'user', text: question });
              this.userInput = '';
              this.loading = true;
              
              // Scroll to bottom
              this.$nextTick(() => { this.scrollToBottom(); });

              try {
                  const response = await fetch('/api/ask', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ query: question })
                  });
                  const data = await response.json();
                  
                  if (data.answer) {
                      this.messages.push({ role: 'assistant', text: data.answer });
                  } else if (data.error) {
                      this.messages.push({ role: 'assistant', text: data.error });
                  } else {
                      this.messages.push({ role: 'assistant', text: 'Forgive me, the archives experienced a brief disturbance. Please try again.' });
                  }
              } catch (err) {
                  this.messages.push({ role: 'assistant', text: 'Connection error. Please ensure the server is active.' });
              } finally {
                  this.loading = false;
                  this.$nextTick(() => { this.scrollToBottom(); });
              }
          },
          scrollToBottom() {
              const container = document.getElementById('chat-container');
              container.scrollTop = container.scrollHeight;
          }
      }">

    <!-- Top Navigation Bar -->
    <header class="h-20 w-full glass-panel border-b border-earth-200/40 flex items-center justify-between px-6 lg:px-12 z-20 shrink-0">
        <a href="{{ url_for('home') }}" class="flex items-center gap-3.5 group">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-earth-500 to-earth-700 flex items-center justify-center text-white shadow-lg shadow-earth-700/20 group-hover:scale-105 transition-transform duration-300">
                <span class="material-symbols-outlined text-[24px]">smart_toy</span>
            </div>
            <div class="flex flex-col">
                <span class="font-serif font-bold text-xl tracking-tight gold-gradient-text">VedaAI Oracle</span>
                <span class="text-[10px] font-semibold text-earth-600 tracking-[0.2em] uppercase -mt-0.5">RAG Wisdom Engine</span>
            </div>
        </a>

        <div class="flex items-center gap-3">
            <a href="{{ url_for('mandira') }}" class="px-4 py-2 rounded-xl bg-sanctum-sand hover:bg-earth-100 text-earth-900 font-semibold text-xs border border-earth-200 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px]">explore</span>
                <span class="hidden sm:inline">Temple Atlas</span>
            </a>
            <a href="{{ url_for('ahara') }}" class="px-4 py-2 rounded-xl bg-sanctum-sand hover:bg-earth-100 text-earth-900 font-semibold text-xs border border-earth-200 transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px]">restaurant</span>
                <span class="hidden sm:inline">Sacred Āhāra</span>
            </a>
        </div>
    </header>

    <!-- Main Chat Workspace -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 flex flex-col overflow-hidden">
        
        <!-- Messages Scroll Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-6 pr-2 py-4">
            <template x-for="msg in messages">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div :class="msg.role === 'user' 
                        ? 'max-w-xl rounded-3xl rounded-tr-sm bg-gradient-to-r from-earth-700 to-earth-600 text-white px-6 py-4 shadow-md text-sm leading-relaxed' 
                        : 'max-w-xl rounded-3xl rounded-tl-sm glass-card text-earth-950 px-6 py-4 shadow-md border border-earth-200/70 text-sm leading-relaxed space-y-2'">
                        
                        <div class="flex items-center gap-2 mb-1 opacity-70 text-[10px] font-bold uppercase tracking-widest">
                            <span class="material-symbols-outlined text-[14px]" x-text="msg.role === 'user' ? 'person' : 'auto_awesome'"></span>
                            <span x-text="msg.role === 'user' ? 'Seeker' : 'VedaAI'"></span>
                        </div>
                        <p x-text="msg.text" class="whitespace-pre-wrap"></p>
                    </div>
                </div>
            </template>

            <!-- Loading Indicator -->
            <div x-show="loading" class="flex justify-start" x-cloak>
                <div class="glass-card rounded-3xl rounded-tl-sm px-6 py-4 shadow-md border border-earth-200/70 flex items-center gap-3">
                    <span class="material-symbols-outlined animate-spin text-earth-600 text-[18px]">progress_activity</span>
                    <span class="text-xs font-semibold text-earth-800 tracking-wide">Consulting ancient scrolls & scriptures...</span>
                </div>
            </div>
        </div>

        <!-- Prompt Input Bar -->
        <div class="pt-4 shrink-0">
            <form @submit.prevent="sendMessage()" class="glass-card p-2 rounded-2xl border border-earth-300/80 shadow-xl flex items-center gap-2">
                <input type="text" x-model="userInput" placeholder="Ask about temple geometry, Ayurvedic dietetics, or Vedic philosophy..."
                       class="flex-1 bg-transparent px-4 py-3 text-xs sm:text-sm text-earth-950 placeholder:text-earth-400 focus:outline-none"/>
                
                <button type="submit" :disabled="loading || !userInput.trim()"
                        class="p-3.5 rounded-xl bg-gradient-to-r from-earth-700 to-earth-600 hover:from-earth-800 hover:to-earth-700 text-white shadow-md disabled:opacity-50 transition-all flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">send</span>
                </button>
            </form>
            <div class="text-center pt-2">
                <span class="text-[10px] text-earth-600 tracking-wider font-semibold">VedaAI RAG Engine • Powered by Sacred Knowledge Bases</span>
            </div>
        </div>

    </main>

</body>
</html>
